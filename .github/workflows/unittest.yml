name: Python regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline unit tests
        env:
          PYTHONPATH: src
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
